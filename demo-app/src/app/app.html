@if (loginStore.isAuthenticated()) {
  <mat-toolbar color="primary" class="nav-bar">
    <span class="app-title">Demo App</span>
    <nav class="nav-links">
      @if (loginStore.role() === 'ADMIN') {
        <a mat-button routerLink="/people">People</a>
        <a mat-button routerLink="/users">Users</a>
        <a mat-button routerLink="/departments">Departments</a>
        <a mat-button routerLink="/projects">Projects</a>
        <a mat-button routerLink="/skills">Skills</a>
      } @else {
        <a mat-button routerLink="/departments">Departments</a>
        <a mat-button routerLink="/projects">Projects</a>
        <a mat-button routerLink="/skills">Skills</a>
      }
    </nav>
    <span class="spacer"></span>
    <span class="role-badge">{{ loginStore.role() }}</span>
    <a mat-button routerLink="/login" (click)="logout()">Logout</a>
  </mat-toolbar>
}
<router-outlet></router-outlet>
