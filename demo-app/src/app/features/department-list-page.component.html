<section class="container">
  @if (loginStore.role() === 'ADMIN') {
    <a routerLink="/users"><button>Go to User Admin Panel</button></a>
  }
  <h2>Departments</h2>
  <button (click)="openForm()">Add Department</button>
  <div *ngIf="errorMessage() as err" class="error">{{ err }}</div>
  <table>
    <thead>
      <tr><th>Name</th><th>Actions</th></tr>
    </thead>
    <tbody>
      @for (dept of departments(); track dept.id) {
        <tr>
          <td>{{ dept.name }}</td>
          <td>
            <button (click)="openForm(dept)">Edit</button>
            <button (click)="deleteDepartment(dept.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  @if (showForm()) {
    <form (ngSubmit)="submitForm()" class="dialog">
      <label>
        Name
        <input [(ngModel)]="formData().name" name="name" required minlength="2" maxlength="100" />
      </label>
      <div *ngIf="errorMessage() as err" class="error">{{ err }}</div>
      <button type="submit">{{ editingId() ? 'Update' : 'Create' }}</button>
      <button type="button" (click)="closeForm()">Cancel</button>
    </form>
  }
</section>
